# Which agent handles which kind of problem, and how the router decides.
# Loaded by src/router/policy.py (override the path with AGENTS_CONFIG).
#
# model: "vision" / "code" / "text" use VISION_MODEL / CODE_MODEL / TEXT_MODEL from .env;
#        anything else is a model id on your provider, e.g. "anthropic/claude-sonnet-4.5".
# tools: browser      inspect_element on the live page, through the extension
#        page_errors  the page's console and failed-network errors
#        repo         list_files / read_file / search_code on the mapped checkout (MCP)
#        kb           query_kb / get_page on the project's knowledge base (MCP)
# max_turns: cap on tool-calling turns before a final answer is forced.

routing:
  # One agent when the top category is at least this likely.
  single_agent_threshold: 0.85
  # Otherwise two agents when the top two together reach the threshold and the second is at
  # least this likely; below that, the user is asked to pick.
  second_agent_min: 0.2

agents:
  frontend:
    description: Looks at the live page (screenshot + elements), then maps it to the code.
    model: vision
    tools: [browser, page_errors]
    max_turns: 2
  backend:
    description: Reads the server code for the failing API, logic or data.
    model: code
    tools: [repo, kb, page_errors, browser]
    max_turns: 4
  ci:
    description: Reads the failing pipeline steps and logs, then the code they point at.
    model: code
    tools: [repo, kb]
    max_turns: 4
  config_env:
    description: Checks configuration, env vars, permissions and dependency versions.
    model: code
    tools: [repo, kb, page_errors]
    max_turns: 3
