<!DOCTYPE html>
<html>

<head>
    <title>CodeReview Agent</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Using a simple SVG icon set for lightweight icons -->
</head>

<body>
    <!-- Main Chat Interface -->
    <div class="header">
        <div class="title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                </path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            CodeReview Agent
        </div>
        <button id="settingsToggleBtn" class="settings-btn" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </div>

    <!-- Chat Viewport -->
    <div id="chatHistory" class="chat-viewport">
        <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1">
                <path
                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                </path>
            </svg>
            <p>How can I help you debug today?</p>
        </div>
        <!-- Chat items injected here -->
    </div>

    <!-- Floating Input Area -->
    <div class="input-area">
        <!-- Quick Action Pills -->
        <div class="context-pills">
            <div class="pill active" id="contextPill" title="Switch Context">Current Page</div>
            <div class="pill" id="ciActionPill" title="Analyze Actions">CI Logs</div>
        </div>

        <div class="universal-input-container">
            <input type="text" id="universalChatInput" class="universal-input" placeholder="Ask anything...">
            <button id="sendBtn" class="send-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <!-- Sliding Settings Panel -->
    <div id="settingsPanel" class="settings-panel">
        <div class="settings-header">
            <button id="closeSettingsBtn" class="back-btn">←</button>
            <h3>Configuration</h3>
        </div>

        <div class="form-group">
            <label>Backend URL (WS)</label>
            <input type="text" id="backendUrlInput" class="form-input" placeholder="ws://localhost:8000">
        </div>

        <div class="form-group">
            <label>Perplexity API Key</label>
            <input type="password" id="apiKey" class="form-input" placeholder="pxl_...">
        </div>

        <div class="form-group">
            <label>Watched Repositories</label>
            <textarea id="watchedReposInput" class="form-textarea" rows="3"
                placeholder="owner/repo1, owner/repo2"></textarea>
        </div>

        <div class="form-group">
            <label style="display: flex; align-items: center; justify-content: space-between;">
                Voice Mode
                <input type="checkbox" id="voiceMode">
            </label>
        </div>

        <button id="saveBtn" class="save-btn">Save Changes</button>
        <div id="status" style="margin-top: 10px; text-align: center; color: var(--accent); font-size: 12px;"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
